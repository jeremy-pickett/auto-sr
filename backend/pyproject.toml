[project]
name = "asr"
# The product release (see CLAUDE.md): 2.2.1 is the deployed app. Not the
# same series as the omnibus requirements spec's v3/v4, which numbers the
# contract rather than the product.
version = "2.2.1"
description = "Autonomous Semantic Ruliology - an LLM invents cellular automaton rules; a harness proves what they do"
requires-python = ">=3.11"
# Runtime dependencies. Both model SDKs are listed: OpenAI is the default
# provider, and anthropic is used when LLM_PROVIDER=anthropic.
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "numpy>=2.5",
    "zstandard>=0.25",
    "openai>=3.51",
    "anthropic>=2.8",
    "google-auth>=2.62",
    "requests>=2.34",
    "pillow>=13.0",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=9.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
